<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — JERSEY</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..900&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
  <script type="module" src="/js/pages/login.js"></script>
</head>
<body>
  <div class="auth">
    <aside class="auth-art" aria-hidden="true">
      <a class="logo" href="/"><span class="logo-mark" data-icon="shirt"></span>JERSEY</a>
      <h2 class="display">Welcome<br>back to<br><em>the game.</em></h2>
      <div class="auth-art-jersey" data-auth-jersey></div>
      <p class="auth-art-foot">Áo đấu chính hãng · Giao nhanh toàn quốc · Đổi trả 30 ngày</p>
    </aside>

    <main class="auth-main">
      <div class="auth-top">
        <a class="logo d-lg-none" href="/"><span class="logo-mark" data-icon="shirt"></span>JERSEY</a>
        <a class="link-more ms-auto" href="/" data-icon="arrow-left">Về trang chủ</a>
      </div>

      <div class="auth-form-wrap">
        <p class="eyebrow">Tài khoản</p>
        <h1 class="display auth-title mt-1">Đăng nhập</h1>
        <p class="auth-sub">Theo dõi đơn hàng, lưu địa chỉ và nhận ưu đãi dành riêng cho thành viên.</p>

        <form class="auth-form" novalidate data-login-form>
          <label class="field">
            <span class="label">Email</span>
            <input class="input" type="email" name="email" autocomplete="email" required placeholder="ban@email.com">
          </label>
          <div class="field">
            <label class="label" for="password">Mật khẩu</label>
            <div class="input-group">
              <input class="input" id="password" type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
              <button class="input-addon" type="button" data-toggle-password aria-label="Hiện mật khẩu"></button>
            </div>
          </div>
          <div class="auth-row">
            <span></span>
            <a class="auth-link" href="/forgot-password.html">Quên mật khẩu?</a>
          </div>
          <button class="btn btn-dark btn-block mt-4" type="submit" data-loading-text="Đang đăng nhập..." data-icon-after="arrow-right">Đăng nhập</button>
        </form>

        <p class="alert alert-info demo-accounts" data-icon="info">
          <span>Tài khoản demo:
            <button type="button" data-demo="admin@jersey.vn|Admin@123">Quản trị</button> ·
            <button type="button" data-demo="customer@jersey.vn|Customer@123">Khách hàng</button></span>
        </p>

        <p class="auth-switch">Chưa có tài khoản? <a class="auth-link" href="/register.html" data-keep-next>Đăng ký ngay</a></p>
      </div>
    </main>
  </div>
</body>
</html>
