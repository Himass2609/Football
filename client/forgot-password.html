<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu — JERSEY</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..900&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
  <script type="module" src="/js/pages/forgot-password.js"></script>
</head>
<body>
  <div class="auth">
    <aside class="auth-art" aria-hidden="true">
      <a class="logo" href="/"><span class="logo-mark" data-icon="shirt"></span>JERSEY</a>
      <h2 class="display">Back<br>in the<br><em>game.</em></h2>
      <div class="auth-art-jersey" data-auth-jersey></div>
      <p class="auth-art-foot">Mã OTP có hiệu lực trong 10 phút và chỉ dùng được một lần.</p>
    </aside>

    <main class="auth-main">
      <div class="auth-top">
        <a class="logo d-lg-none" href="/"><span class="logo-mark" data-icon="shirt"></span>JERSEY</a>
        <a class="link-more ms-auto" href="/login.html" data-icon="arrow-left">Đăng nhập</a>
      </div>

      <div class="auth-form-wrap">
        <p class="eyebrow">Khôi phục tài khoản</p>
        <h1 class="display auth-title mt-1">Quên mật khẩu</h1>
        <div class="steps" aria-hidden="true"><span class="done"></span><span></span><span></span></div>

        <!-- Bước 1: email -->
        <form class="auth-form" novalidate data-step="1">
          <p class="auth-sub">Nhập email đã đăng ký, chúng tôi sẽ gửi mã OTP gồm 6 chữ số.</p>
          <label class="field mt-4">
            <span class="label">Email</span>
            <input class="input" type="email" name="email" autocomplete="email" required placeholder="ban@email.com">
          </label>
          <button class="btn btn-dark btn-block mt-4" type="submit" data-loading-text="Đang gửi mã..." data-icon-after="arrow-right">Gửi mã OTP</button>
        </form>

        <!-- Bước 2: OTP -->
        <form class="auth-form" novalidate data-step="2" hidden>
          <p class="auth-sub">Mã OTP đã được gửi tới <strong data-email-label></strong>. Kiểm tra cả hộp thư rác.</p>
          <label class="field mt-4">
            <span class="label">Mã OTP</span>
            <input class="input otp-input" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required placeholder="••••••">
          </label>
          <button class="btn btn-dark btn-block mt-4" type="submit" data-loading-text="Đang xác thực..." data-icon-after="arrow-right">Xác nhận</button>
          <div class="auth-row">
            <button class="auth-link" type="button" data-back>Đổi email</button>
            <button class="auth-link" type="button" data-resend>Gửi lại mã</button>
          </div>
        </form>

        <!-- Bước 3: mật khẩu mới -->
        <form class="auth-form" novalidate data-step="3" hidden>
          <p class="auth-sub">Tạo mật khẩu mới cho tài khoản của bạn.</p>
          <div class="field mt-4">
            <label class="label" for="newPassword">Mật khẩu mới</label>
            <div class="input-group">
              <input class="input" id="newPassword" type="password" name="newPassword" autocomplete="new-password" required placeholder="Tối thiểu 8 ký tự, gồm chữ và số">
              <button class="input-addon" type="button" data-toggle-password aria-label="Hiện mật khẩu"></button>
            </div>
            <div class="strength" data-strength data-level="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="field">
            <label class="label" for="confirm">Nhập lại mật khẩu</label>
            <input class="input" id="confirm" type="password" name="confirm" autocomplete="new-password" required>
          </div>
          <button class="btn btn-dark btn-block mt-4" type="submit" data-loading-text="Đang cập nhật..." data-icon-after="check">Đặt lại mật khẩu</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
