<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tin tức — JERSEY</title>
  <meta name="description" content="Tin tức bộ sưu tập mới, hướng dẫn chọn size và câu chuyện áo đấu từ JERSEY.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..900&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages/home.css">
  <link rel="stylesheet" href="/css/pages/news.css">
  <script type="module" src="/js/pages/news.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-banner">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Trang chủ</a><span>/</span><span>Tin tức</span></nav>
        <h1 class="display">From the pitch</h1>
        <p class="text-muted-c mt-2">Bộ sưu tập mới, cẩm nang chọn áo và những câu chuyện phía sau mỗi chiếc áo đấu.</p>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="news-toolbar">
          <div class="chips" data-categories role="group" aria-label="Chuyên mục"></div>
          <label class="search-box">
            <span class="visually-hidden">Tìm bài viết</span>
            <span data-icon="search"></span>
            <input class="input" type="search" placeholder="Tìm bài viết..." data-search>
          </label>
        </div>
        <div class="row g-4 gy-5" data-list></div>
        <div class="pagination news-grid-pagination" data-pagination></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
