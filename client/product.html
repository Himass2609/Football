<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sản phẩm — JERSEY</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..900&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/product.css">
  <link rel="stylesheet" href="/css/pages/shop.css">
  <script type="module" src="/js/pages/product.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container" data-product>
      <div class="pdp">
        <div class="skeleton" style="aspect-ratio:4/5"></div>
        <div>
          <div class="skeleton" style="height:14px;width:40%"></div>
          <div class="skeleton mt-3" style="height:44px;width:90%"></div>
          <div class="skeleton mt-4" style="height:32px;width:30%"></div>
        </div>
      </div>
    </div>

    <section class="section pt-0" data-related-section hidden>
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">Có thể bạn cũng thích</p>
            <h2 class="display section-title mt-1">Sản phẩm liên quan</h2>
          </div>
        </div>
        <div class="product-grid" data-related></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
