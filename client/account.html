<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tài khoản của tôi — JERSEY</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..900&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages/account.css">
  <script type="module" src="/js/pages/account.js"></script>
</head>
<body data-protected>
  <div id="site-header"></div>

  <main>
    <section class="page-banner">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Trang chủ</a><span>/</span><span>Tài khoản</span></nav>
        <h1 class="display">Tài khoản của tôi</h1>
      </div>
    </section>

    <section class="section-tight">
      <div class="container account-layout">
        <aside class="account-nav">
          <div class="account-user">
            <span class="avatar" data-avatar>J</span>
            <div style="min-width:0">
              <p class="cell-main text-truncate" data-user-name>—</p>
              <p class="cell-sub text-truncate" data-user-email>—</p>
            </div>
          </div>
          <nav aria-label="Mục tài khoản">
            <button class="account-link" type="button" data-tab="profile" aria-current="true" data-icon="user">Hồ sơ cá nhân</button>
            <button class="account-link" type="button" data-tab="security" data-icon="key">Đổi mật khẩu</button>
            <button class="account-link" type="button" data-tab="orders" data-icon="bag">Đơn hàng<span class="soon">Sắp có</span></button>
            <button class="account-link" type="button" data-tab="addresses" data-icon="truck">Sổ địa chỉ<span class="soon">Sắp có</span></button>
            <button class="account-link" type="button" data-logout data-icon="log-out">Đăng xuất</button>
          </nav>
        </aside>

        <div>
          <!-- Hồ sơ -->
          <section class="card" data-panel="profile">
            <div class="card-body">
              <h2 class="display panel-title">Hồ sơ cá nhân</h2>
              <p class="panel-sub">Thông tin dùng để giao hàng và liên hệ khi cần.</p>
              <form class="mt-5" novalidate data-profile-form>
                <div class="row g-4">
                  <div class="col-12 col-md-6">
                    <label class="field"><span class="label">Họ và tên <span class="req">*</span></span>
                      <input class="input" name="fullName" maxlength="100" required></label>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="field"><span class="label">Email</span>
                      <input class="input" name="email" disabled>
                      <span class="field-help">Email dùng để đăng nhập, không thể thay đổi.</span></label>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="field"><span class="label">Số điện thoại</span>
                      <input class="input" type="tel" name="phone" placeholder="09xxxxxxxx"></label>
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="field"><span class="label">Giới tính</span>
                      <select class="select" name="gender">
                        <option value="">—</option>
                        <option value="MALE">Nam</option>
                        <option value="FEMALE">Nữ</option>
                        <option value="OTHER">Khác</option>
                      </select></label>
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="field"><span class="label">Ngày sinh</span>
                      <input class="input" type="date" name="birthday"></label>
                  </div>
                </div>
                <div class="form-actions">
                  <button class="btn btn-dark" type="submit" data-loading-text="Đang lưu...">Lưu thay đổi</button>
                </div>
              </form>
            </div>
          </section>

          <!-- Đổi mật khẩu -->
          <section class="card" data-panel="security" hidden>
            <div class="card-body">
              <h2 class="display panel-title">Đổi mật khẩu</h2>
              <p class="panel-sub">Mật khẩu tối thiểu 8 ký tự, gồm chữ và số.</p>
              <form class="mt-5" novalidate data-password-form style="max-width:440px">
                <div class="field">
                  <label class="label" for="currentPassword">Mật khẩu hiện tại</label>
                  <div class="input-group">
                    <input class="input" id="currentPassword" type="password" name="currentPassword" autocomplete="current-password" required>
                    <button class="input-addon" type="button" data-toggle-password aria-label="Hiện mật khẩu"></button>
                  </div>
                </div>
                <div class="field">
                  <label class="label" for="newPassword">Mật khẩu mới</label>
                  <div class="input-group">
                    <input class="input" id="newPassword" type="password" name="newPassword" autocomplete="new-password" required>
                    <button class="input-addon" type="button" data-toggle-password aria-label="Hiện mật khẩu"></button>
                  </div>
                </div>
                <div class="field">
                  <label class="label" for="confirm">Nhập lại mật khẩu mới</label>
                  <input class="input" id="confirm" type="password" name="confirm" autocomplete="new-password" required>
                </div>
                <div class="form-actions">
                  <button class="btn btn-dark" type="submit" data-loading-text="Đang cập nhật...">Cập nhật mật khẩu</button>
                </div>
              </form>
            </div>
          </section>

          <!-- Phase 3 -->
          <section class="card" data-panel="orders" hidden>
            <div class="card-body" data-soon="bag|Đơn hàng của bạn|Chức năng đặt hàng & theo dõi đơn sẽ có ở Phase 3."></div>
          </section>
          <section class="card" data-panel="addresses" hidden>
            <div class="card-body" data-soon="truck|Sổ địa chỉ|Quản lý địa chỉ giao hàng sẽ có ở Phase 3."></div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
