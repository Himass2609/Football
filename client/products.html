<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cửa hàng — JERSEY</title>
  <meta name="description" content="Áo đấu câu lạc bộ, đội tuyển, retro, đồ tập và phụ kiện bóng đá chính hãng.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..900&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/product.css">
  <link rel="stylesheet" href="/css/pages/shop.css">
  <script type="module" src="/js/pages/products.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-banner">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb" data-breadcrumb><a href="/">Trang chủ</a><span>/</span><span>Cửa hàng</span></nav>
        <h1 class="display" data-title>Cửa hàng</h1>
        <p class="text-muted-c mt-2" data-subtitle>Áo đấu chính hãng của các câu lạc bộ và đội tuyển hàng đầu.</p>
      </div>
    </section>

    <section class="section-tight">
      <div class="container shop-layout">
        <aside class="filters" data-filters aria-label="Bộ lọc sản phẩm">
          <div class="filters-head">
            <strong>Bộ lọc</strong>
            <button class="icon-btn" type="button" data-filters-close aria-label="Đóng bộ lọc" data-icon="x"></button>
          </div>
          <div data-filter-groups></div>
        </aside>
        <div class="filters-backdrop" data-filters-close hidden></div>

        <div>
          <div class="shop-toolbar">
            <button class="btn btn-outline btn-sm filter-toggle" type="button" data-filters-open data-icon="sliders">Bộ lọc</button>
            <label class="search-box">
              <span class="visually-hidden">Tìm sản phẩm</span>
              <span data-icon="search"></span>
              <input class="input" type="search" placeholder="Tìm áo, đội bóng, cầu thủ..." data-search>
            </label>
            <label>
              <span class="visually-hidden">Sắp xếp</span>
              <select class="select" data-sort>
                <option value="newest">Mới nhất</option>
                <option value="best_selling">Bán chạy</option>
                <option value="price_asc">Giá tăng dần</option>
                <option value="price_desc">Giá giảm dần</option>
                <option value="name_asc">Tên A → Z</option>
              </select>
            </label>
          </div>
          <div class="result-line" data-result-line aria-live="polite"></div>
          <div class="product-grid" data-grid></div>
          <div class="pagination shop-pagination" data-pagination></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
