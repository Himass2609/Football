<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký — JERSEY</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..900&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
  <script type="module" src="/js/pages/register.js"></script>
</head>
<body>
  <div class="auth">
    <aside class="auth-art" aria-hidden="true">
      <a class="logo" href="/"><span class="logo-mark" data-icon="shirt"></span>JERSEY</a>
      <h2 class="display">Join<br>the <em>squad.</em></h2>
      <div class="auth-art-jersey" data-auth-jersey></div>
      <p class="auth-art-foot">Thành viên mới nhận ngay mã WELCOME10 — giảm 10% đơn đầu tiên.</p>
    </aside>

    <main class="auth-main">
      <div class="auth-top">
        <a class="logo d-lg-none" href="/"><span class="logo-mark" data-icon="shirt"></span>JERSEY</a>
        <a class="link-more ms-auto" href="/" data-icon="arrow-left">Về trang chủ</a>
      </div>

      <div class="auth-form-wrap">
        <p class="eyebrow">Thành viên mới</p>
        <h1 class="display auth-title mt-1">Tạo tài khoản</h1>
        <p class="auth-sub">Chỉ mất 30 giây để bắt đầu mua sắm và theo dõi đơn hàng.</p>

        <form class="auth-form" novalidate data-register-form>
          <label class="field">
            <span class="label">Họ và tên <span class="req">*</span></span>
            <input class="input" name="fullName" autocomplete="name" required maxlength="100" placeholder="Nguyễn Văn A">
          </label>
          <div class="row g-3 mt-0">
            <div class="col-12 col-sm-7">
              <label class="field">
                <span class="label">Email <span class="req">*</span></span>
                <input class="input" type="email" name="email" autocomplete="email" required placeholder="ban@email.com">
              </label>
            </div>
            <div class="col-12 col-sm-5">
              <label class="field">
                <span class="label">Số điện thoại <span class="req">*</span></span>
                <input class="input" type="tel" name="phone" autocomplete="tel" required placeholder="09xxxxxxxx">
              </label>
            </div>
          </div>
          <div class="field mt-3">
            <label class="label" for="password">Mật khẩu <span class="req">*</span></label>
            <div class="input-group">
              <input class="input" id="password" type="password" name="password" autocomplete="new-password" required placeholder="Tối thiểu 8 ký tự, gồm chữ và số">
              <button class="input-addon" type="button" data-toggle-password aria-label="Hiện mật khẩu"></button>
            </div>
            <div class="strength" data-strength data-level="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="field">
            <label class="label" for="confirm">Nhập lại mật khẩu <span class="req">*</span></label>
            <input class="input" id="confirm" type="password" name="confirm" autocomplete="new-password" required>
          </div>
          <label class="check mt-4">
            <input type="checkbox" name="agree" required>
            <span>Tôi đồng ý với điều khoản sử dụng và chính sách bảo mật</span>
          </label>
          <button class="btn btn-dark btn-block mt-4" type="submit" data-loading-text="Đang tạo tài khoản..." data-icon-after="arrow-right">Đăng ký</button>
        </form>

        <p class="auth-switch">Đã có tài khoản? <a class="auth-link" href="/login.html" data-keep-next>Đăng nhập</a></p>
      </div>
    </main>
  </div>
</body>
</html>
